name: Publish to npm

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Publish to npm
        timeout-minutes: 12
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is empty" >&2
            exit 1
          fi
          # Trim accidental whitespace/newlines from secret
          export NODE_AUTH_TOKEN="$(printf '%s' "$NODE_AUTH_TOKEN" | tr -d '\r\n')"
          echo "token_len=${#NODE_AUTH_TOKEN} prefix=${NODE_AUTH_TOKEN:0:4}"

          echo "Checking npm status..."
          curl -fsS --max-time 10 https://status.npmjs.org/api/v2/status.json \
            | tee /tmp/npm-status.json \
            | python3 -c "import sys,json; s=json.load(sys.stdin).get('status',{}); print(s.get('indicator'), s.get('description'))" \
            || true

          # Auth probe with retries (npm auth endpoints hang during publishing outages)
          auth_ok=0
          for i in 1 2 3 4 5; do
            echo "whoami attempt $i..."
            code=$(curl -sS --max-time 15 --ipv4 --http1.1 \
              -o /tmp/npm-whoami.json -w "%{http_code}" \
              -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
              https://registry.npmjs.org/-/whoami || true)
            echo "whoami_http=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/npm-whoami.json; echo
              auth_ok=1
              break
            fi
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "npm auth rejected (HTTP $code). Rotate repo secret NPM_TOKEN." >&2
              cat /tmp/npm-whoami.json || true
              exit 1
            fi
            sleep $((i * 15))
          done
          if [ "$auth_ok" != "1" ]; then
            echo "npm auth endpoint unreachable after retries (likely npm publishing outage)." >&2
            echo "See https://status.npmjs.org — will still attempt publish with retries." >&2
          fi

          for i in 1 2 3 4 5 6; do
            echo "publish attempt $i..."
            if pnpm publish --access public --no-git-checks; then
              echo "publish ok"
              exit 0
            fi
            echo "publish failed; sleeping..."
            sleep $((i * 20))
          done
          echo "publish failed after retries" >&2
          exit 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${TAG_NAME#v}"
          cat > release-notes.md <<'EOF'
          ## Pi Custom Provider Manager

          Pi extension for managing OpenAI-compatible custom providers.

          ### Installation

          Install the latest version globally for Pi:

          ```bash
          pi install npm:@fe-essential/pi-custom-provider-manager
          ```

          Install this exact release:

          ```bash
          pi install npm:@fe-essential/pi-custom-provider-manager@__VERSION__
          ```

          Install only for the current project:

          ```bash
          pi install -l npm:@fe-essential/pi-custom-provider-manager
          ```

          Try it temporarily without writing settings:

          ```bash
          pi -e npm:@fe-essential/pi-custom-provider-manager
          ```

          ### Usage

          Start Pi, then run `/provider` inside the Pi session.

          Interactive setup:

          ```text
          /provider add
          ```

          The command prompts for:

          1. Provider id
          2. Base URL
          3. API key environment variable or value
          4. Display name

          Non-interactive setup:

          ```text
          /provider add my-gateway https://example.com/v1 MY_GATEWAY_API_KEY
          ```

          Manage providers:

          ```text
          /provider sync my-gateway
          /provider list
          /provider show my-gateway
          /provider set my-gateway apiKey MY_NEW_API_KEY
          /provider delete my-gateway
          ```

          `apiKey` can be a direct value or an environment variable reference.
          Examples: `MY_GATEWAY_API_KEY`, `$MY_GATEWAY_API_KEY`,
          or `${MY_GATEWAY_API_KEY}`.

          ### Config files

          Provider config:

          ```text
          ~/.pi/agent/extensions/custom-provider-manager/providers.json
          ```

          models.dev cache:

          ```text
          ~/.pi/agent/extensions/custom-provider-manager/models-dev-cache.json
          ```
          EOF

          sed -i "s/__VERSION__/${PACKAGE_VERSION}/g" release-notes.md

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          fi
